steps:
  # Build the multi-stage web image
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - '${_IMAGE}:${SHORT_SHA}'
      - -t
      - '${_IMAGE}:latest'
      - '--build-arg'
      - 'VITE_MAPBOX_ACCESS_TOKEN=${_VITE_MAPBOX_ACCESS_TOKEN}'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      - .

  # Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '${_IMAGE}'
    waitFor: ['build']

images:
  - '${_IMAGE}:${SHORT_SHA}'
  - '${_IMAGE}:latest'

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/runway-515115/runway-web/app'
  _VITE_MAPBOX_ACCESS_TOKEN: ''
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
